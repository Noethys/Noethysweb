{% extends "facturation/base_panneau_impression.html" %}

{% block scripts_page %}
        <script>

            function on_bouton_valider() {
                var box = bootbox.dialog({
                    title: "Confirmation du transfert",
                    message: "Confirmez-vous le transfert des rappels vers l'éditeur d'emails ?",
                    buttons: {
                        ok: {
                            label: "<i class='fa fa-check'></i> Transférer",
                            className: 'btn-primary',
                            callback: function(){
                                // Attend la fermeture de la confirmation avant d'ouvrir la fenêtre d'attente
                                box.one("hidden.bs.modal", function() { impression_pdf(); });
                            }
                        },
                        cancel: {
                            label: "<i class='fa fa-ban'></i> Annuler",
                            className: 'btn-danger',
                        }
                    }
                });

            };

            // Impression du PDF
            function impression_pdf() {
                if (!panneau_attente_debut("Préparation des emails", "Création d'un PDF par lettre de rappel. Veuillez patienter, l'opération peut durer plusieurs minutes.")) { return; }
                $.ajax({
                    type: "POST",
                    url: "{% url 'ajax_rappels_email_pdf' %}",
                    data: {
                        form_modele_impression: JSON.stringify($("#choix_modele_impression_form").serializeObject()),
                        form_modele_document: JSON.stringify($("#choix_modele_form").serializeObject()),
                        form_parametres: JSON.stringify($("#options_impression_form").serializeObject()),
                        rappels_coches: JSON.stringify(get_coches()),
                        csrfmiddlewaretoken: '{{ csrf_token }}',
                    },
                    datatype: "json",
                    success: function(data){
                        // La fenêtre d'attente reste affichée pendant l'ouverture de l'éditeur d'emails
                        panneau_attente_titre("Ouverture de l'éditeur d'emails");
                        window.location.href = data.url;
                    },
                    error: function(data) {
                        panneau_attente_fin();
                        toastr.error(panneau_message_erreur(data));
                    }
                })
            };

        </script>
{% endblock scripts_page %}
