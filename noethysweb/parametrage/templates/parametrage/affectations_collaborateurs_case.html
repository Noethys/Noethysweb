<div class="custom-control custom-checkbox" id="div_{{ field.auto_id }}">
    <input type="checkbox" name="{{ field.html_name }}" class="custom-control-input" id="{{ field.auto_id }}"{% if field.value %} checked{% endif %}>
    <label class="custom-control-label" for="{{ field.auto_id }}">Utiliser</label>
</div>
