{% load static i18n %}

<nav class="app-header navbar navbar-expand navbar-dark border-bottom-0"
    style="background-color: #367da6 !important;"
    aria-label="{% trans "Barre de navigation supérieure" %}"
>
    <span class="visually-hidden">{% trans "Barre de navigation supérieure" %}</span>

    <div class="container-fluid">

        <ul class="navbar-nav" role="list">
            <li class="nav-item css-dependent" hidden role="listitem">
                <button type="button" class="nav-link btn btn-link border-0"
                        data-lte-toggle="sidebar"
                        title="Réduire ou agrandir le menu latéral"
                        aria-label="Réduire ou agrandir le menu latéral">
                    <i class="bi bi-list" aria-hidden="true"></i>
                </button>
            </li>

            <li class="nav-item" role="listitem">
                <button class="nav-link btn btn-link border-0 p-0 px-3"
                        type="button"
                        data-bs-toggle="modal"
                        data-bs-target="#modal_accessibilite"
                        aria-label="Ouvrir les réglages d'accessibilité"
                        aria-haspopup="dialog">
                    <i class="bi bi-universal-access-circle" aria-hidden="true"></i>
                    <span class="d-none d-md-inline ms-1">Accessibilité</span>
                </button>
            </li>

            <li class="nav-item" role="listitem">
                <button class="nav-link btn btn-link border-0 p-0 px-3"
                        type="button"
                        data-bs-toggle="modal"
                        data-bs-target="#modal_langue"
                        aria-label="Ouvrir les réglages de la langue"
                        aria-haspopup="dialog">
                    <i class="bi bi-translate" aria-hidden="true"></i>
                    <span class="d-none d-md-inline ms-1">Langue</span>
                </button>
            </li>

            <li class="nav-item" role="listitem">
                <button class="nav-link btn btn-link border-0 p-0 px-3"
                        type="button"
                        data-bs-toggle="modal"
                        data-bs-target="#modal_theme"
                        aria-label="Choisir le thème"
                        aria-haspopup="dialog">
                    <i class="bi bi-circle-half" aria-hidden="true"></i>
                    <span class="d-none d-md-inline ms-1">Thème</span>
                </button>
            </li>
        </ul>

        <ul class="navbar-nav ml-auto" role="list">

            {# Utilisateur en cours #}
            <li class="nav-item dropdown user-menu" role="listitem">
                <a href="{% url 'portail_profil' %}" class="nav-link" title="{% trans "Paramètres du compte" %}">
                    <span class="d-none d-sm-inline">
                        {{ request.user.famille }}
                    </span>
                </a>
            </li>

            {# Bouton de déconnexion #}
            <li class="nav-item" role="listitem">
                <form action="{% url 'portail_deconnexion' %}" method="post" aria-label="Déconnexion">
                    {% csrf_token %}
                    <button class="btn btn-danger" type="submit" title="{% trans "Se déconnecter" %}">
                        <i class="bi bi-power" aria-hidden="true"></i>
                        <span class="visually-hidden">{% trans "Se déconnecter" %}</span>
                    </button>
                </form>
            </li>

        </ul>
    </div>
</nav>


<script>
(() => {
    'use strict';
    const STORAGE_KEY = 'noethysweb_theme';
    const prefersDark = () => globalThis.matchMedia('(prefers-color-scheme: dark)').matches;
    const stored = localStorage.getItem(STORAGE_KEY);
    if (!stored) localStorage.setItem(STORAGE_KEY, 'auto');
    const theme = localStorage.getItem(STORAGE_KEY);
    const resolved = theme === 'auto' ? (prefersDark() ? 'dark' : 'light') : theme;
    document.documentElement.setAttribute('data-bs-theme', resolved);
})();
</script>
